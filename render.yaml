services:
  - type: web
    name: dream-chaser-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace=server
    startCommand: npm start --workspace=server
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - server/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
